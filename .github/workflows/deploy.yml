name: Deploy Undoku Wiki to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wiki/package-lock.json

      - name: Install dependencies
        run: |
          cd wiki
          npm ci

      - name: Build Astro Wiki & Starlight
        run: |
          cd wiki
          npm run build

      - name: Assemble GitHub Pages Deployment (Game at Root /, Wiki at /wiki/)
        run: |
          mkdir -p site_dist
          cp web/index.html site_dist/index.html
          mkdir -p site_dist/wiki
          cp -r wiki/dist/* site_dist/wiki/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site_dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
