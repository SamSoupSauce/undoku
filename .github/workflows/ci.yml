name: CI/CD Pipeline 🚀

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build-go:
    name: Test & Build Go Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache: true

      - name: Verify Go Module Dependencies
        run: go mod verify

      - name: Run Unit Tests
        run: go test -v -race ./...

      - name: Build Go Binary
        run: go build -v -o undoku .

  build-astro-wiki:
    name: Build Astro Starlight Wiki
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: wiki/package-lock.json

      - name: Install Wiki Dependencies
        working-directory: ./wiki
        run: npm ci

      - name: Build Astro Wiki Static Output
        working-directory: ./wiki
        run: npm run build
