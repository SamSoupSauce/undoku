name: CI/CD Pipeline 🚀

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-astro-wiki:
    name: Build Astro Starlight Wiki
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: wiki/package-lock.json

      - name: Install Wiki Dependencies
        working-directory: ./wiki
        run: npm ci

      - name: Build Astro Wiki Static Output
        working-directory: ./wiki
        run: npm run build
